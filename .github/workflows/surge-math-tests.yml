name: SURGE math tests
on:
  push:
    paths:
      - 'src/SurgePhysicsMath.cs'
      - 'tests/**'
      - '.github/workflows/surge-math-tests.yml'
  pull_request:
    paths:
      - 'src/SurgePhysicsMath.cs'
      - 'tests/**'
      - '.github/workflows/surge-math-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run math regression checks
        run: dotnet run --project tests/SurgePhysicsMath.Tests/SurgePhysicsMath.Tests.csproj
